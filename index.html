<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa cmg?answer_mimis</title>
<style>
:root {
--pink: #ff4d8d;
--pink-dark: #ff2e75;
--bg1: #0f0c1a;
--bg2: #1a1230;
--card-bg: #1c1830;
--text: #e8e6f0;
}

• {
box-sizing: border-box;
}

html, body {
margin: 0;
height: 100%;
overflow: hidden;
}

body {
font-family: "Segoe UI", "Trebuchet MS", sans-serif;
background: linear-gradient(135deg, var(--bg1), var(--bg2));
display: flex;
align-items: center;
justify-content: center;
position: relative;
}

.card {
background: var(--card-bg);
padding: 40px 50px;
border-radius: 24px;
box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(255, 77, 141, 0.1);
text-align: center;
max-width: 90vw;
border: 1px solid rgba(255, 77, 141, 0.15);
}

h1 {
color: var(--pink-dark);
font-size: clamp(28px, 6vw, 42px);
margin: 0 0 30px;
}

.buttons {
display: flex;
gap: 20px;
justify-content: center;
position: relative;
min-height: 70px;
}

button {
border: none;
border-radius: 14px;
padding: 16px 36px;
font-size: 18px;
font-weight: bold;
cursor: pointer;
transition: transform 0.15s ease, box-shadow 0.15s ease;
}

#sim {
background: var(--pink);
color: #fff;
box-shadow: 0 8px 20px rgba(255, 92, 138, 0.4);
}

#sim:hover {
transform: scale(1.1);
background: var(--pink-dark);
}

#nao {
background: #2a2540;
color: #8b86a3;
position: relative;
}

#nao.fugindo {
position: fixed;
}

.final {
font-size: clamp(18px, 3.5vw, 26px);
color: var(--text);
line-height: 1.5;
}

.hidden {
display: none !important;
}
</style>
</head>
<body>

<div class="card" id="card">
<h1 id="pergunta">Aceita ter uma relação de exclusividade cmg? 🔓😁 </h1>
<div class="buttons">
<button id="sim">SIM</button>
<button id="nao">NÃO</button>
</div>
</div>

<div class="card hidden" id="final">
<div class="final">
Ebaaaaaaaa a chave ja é sua, joga bem longe 🗝😜<br>
</div>
</div>

<script>
const nao = document.getElementById('nao');
const sim = document.getElementById('sim');
const card = document.getElementById('card');
const final = document.getElementById('final');

function fugir() {
nao.classList.add('fugindo');
const margem = 20;
const maxX = window.innerWidth - nao.offsetWidth - margem;
const maxY = window.innerHeight - nao.offsetHeight - margem;
const novoX = Math.random() * maxX;
const novoY = Math.random() * maxY;
nao.style.left = novoX + 'px';
nao.style.top = novoY + 'px';
}

nao.addEventListener('mouseenter', fugir);
nao.addEventListener('click', fugir);
nao.addEventListener('touchstart', function (e) {
e.preventDefault();
fugir();
});

sim.addEventListener('click', function () {
card.classList.add('hidden');
final.classList.remove('hidden');
});
</script>

</body>
</html>
